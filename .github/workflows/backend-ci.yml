# Backend CI — hermetic test suite + live dependency security scan.
#
# Mirrors what scripts/scan_deps.sh does locally (that script is
# macOS/launchd-specific; CI runs the same two layers directly):
#   1. pip-audit hard gate  — fails on any NEW vulnerability. The known,
#      unfixable chromadb risk (PYSEC-2026-311, embedded-only usage — see
#      AI_Girl_Security.md §11.3) is explicitly ignored.
#   2. Live CVE-agent test   — real OSV.dev query via test_cve_live_scan.py,
#      asserting fastapi reports zero advisories (guards the version-aware
#      query from regressing).
#
# The full hermetic backend suite runs on every trigger; the schedule adds a
# nightly belt-and-suspenders run that also catches dependency drift.
#
# A separate frontend-audit job gates production npm dependencies (npm audit
# --omit=dev) on every run; the schedule catches drift there too.
#
# flutter-sdk-stale-check (schedule-only) watches the mobile job's pinned SDK
# so the exact-version pin can't silently go stale; workflow_dispatch lets you
# run it on demand.

name: Backend CI

on:
  push:                 # every push, any branch
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch:    # manual re-run of the stale check (and everything else)

# PRs fire both push and pull_request — cancel superseded runs instead of
# queueing duplicates on a shared repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: pip install -r server/requirements.txt

      - name: Hermetic backend suite
        run: python -m pytest server/tests/ -q

      - name: pip-audit gate (new findings fail; chromadb vulnerabilities are documented accepted risks)
        run: pip-audit -l --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 --ignore-vuln PYSEC-2026-3813

      # Note: the CVE agent degrades gracefully — if api.osv.dev is unreachable
      # it returns no findings, so this step passes vacuously (a documented
      # network-outage degradation, not a real green).
      - name: Live CVE agent scan (real OSV query — fastapi must report zero advisories)
        env:
          RUN_LIVE_TESTS: "1"
        run: python -m pytest server/tests/test_cve_live_scan.py -q -s

      # Final smoke: the same `npm run health` command humans use. On this
      # Linux runner launchd doesn't exist, so health() takes its n/a branch
      # and passes (AARIYA_NO_LAUNCHD=1 forces that branch deterministically);
      # it still verifies the script + npm alias execute cleanly end-to-end.
      # The real health gates are the three steps above.
      - name: health smoke (npm run health)
        env:
          AARIYA_NO_LAUNCHD: "1"
        run: npm run health

  # Frontend production-dependency gate, isolated from the backend job so npm
  # install flakiness can't block (or fail attribution of) the Python suite.
  # Runs `npm ci` from the lockfile (legacy-peer-deps: the app deliberately
  # runs framer-motion@10 on React 19 — npm's strict resolver rejects that
  # combination), then gates on PRODUCTION advisories only (--omit=dev).
  # The dev-only findings (vite, electron, ...) are deliberately not gates.
  # Local equivalents: npm run security:audit (non-gating) / scan_deps.sh.
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.15.0 is the floor, not a preference: src/gev/js/hudAltitudeDatum
          # .test.mjs uses node:module's synchronous registerHooks(), added in
          # v22.15.0. On the old Node 20 pin that file failed to load, and
          # aisWatchdogTransport.test.mjs also failed because Node's built-in
          # WebSocket close() semantics differ by major. package.json engines
          # declares the same floor — keep the two in sync.
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps (lockfile, legacy peer resolution)
        run: npm ci --legacy-peer-deps

      - name: npm audit gate (production deps clean, documented exceptions allowed)
        # scripts/audit_gate.mjs runs `npm audit --omit=dev --json` and fails on
        # any finding not listed in its ALLOWED table. npm audit has no
        # per-advisory ignore flag, so an unfixable transitive finding would
        # otherwise block every push. Matched on package + advisory id, so a new
        # advisory in an allow-listed package still fails the build.
        run: node scripts/audit_gate.mjs

      # Frontend correctness gates. These run in the same job because it has
      # already paid the `npm ci` cost; a red here is unambiguously frontend.
      #   lint:  flat-config ESLint. Unused bindings are warnings (~100 today,
      #          mostly in vite.gev.new-proxies.js and the generated GEV data
      #          modules); anything that would actually break at runtime —
      #          undefined identifiers, conditional hooks — is an error and
      #          fails the job.
      #   test:  npm test = test:unit (app + Electron tests) && test:gev
      #          (src/gev/js/**/*.test.mjs). Both are hermetic — no browser and
      #          no network. The two GEV allocation microbenchmarks calibrate to
      #          Node 24 and self-skip on this job's Node 22 runner.
      #   build: catches import/bundling regressions the unit tests can't see.
      #          This one has teeth: src/gev/js/data/localLayers.js imports its
      #          datasets with Vite `?url`, so a checkout missing
      #          src/gev/js/data/local_data/ fails the build outright.
      - name: Lint gate (eslint, flat config)
        run: npm run lint

      - name: Unit + GEV test suites
        run: npm test

      - name: Production build
        run: npm run build

  # Mobile app gate — Flutter static analysis + test suite, isolated so pub
  # resolution/CI flakiness can't block (or fail attribution of) the other
  # jobs. Both gates are pure-Dart (no platform plugin builds needed):
  #   - flutter analyze: zero issues is the bar (strict, mirrors local dev)
  #   - flutter test:    unit/widget + golden tests run headless via the test
  #                      widget binder on Linux. The orb goldens
  #                      (orb_screen_golden_test.dart → test/goldens/*.png) are
  #                      pure-CustomPainter with deterministic seeds, so they
  #                      rasterize identically on any host for the pinned SDK.
  #                      Regenerate intentionally with:
  #                        flutter test --update-goldens test/orb_screen_golden_test.dart
  #                      Version pinned to the locally-proven SDK so CI
  #                      reproduces the dev environment.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Resolve dependencies (pub get)
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        run: flutter analyze

      - name: Test suite (flutter test)
        run: flutter test

  # Flutter SDK staleness check — runs ONLY on the nightly schedule (never on
  # push/PR, where it would wrongly fail unrelated work). Parses the pinned
  # flutter-version from THIS file (single source of truth — the same value the
  # mobile job installs), then compares it against the latest stable release
  # published by Flutter (resolved via current_release.stable hash → version).
  # When the pin is stale the job FAILS the nightly run (loud, persistent red)
  # and opens a GitHub issue (idempotent — one open issue per stale pin) so the
  # staleness can't be silently ignored. Fix = bump flutter-version in the
  # mobile job and regenerate goldens if rendering changed.
  flutter-sdk-stale-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write        # open/close the stale-pin issue
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned SDK vs latest stable
        id: sdk
        run: |
          PINNED=$(grep -oE 'flutter-version: "[0-9]+\.[0-9]+\.[0-9]+"' .github/workflows/backend-ci.yml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$PINNED" ]; then
            echo "::error::Could not parse flutter-version from .github/workflows/backend-ci.yml"
            exit 1
          fi
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          LATEST=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          stable_hash = d["current_release"]["stable"]
          for r in d["releases"]:
              if r.get("hash") == stable_hash:
                  print(r["version"]); break
          else:
              sys.exit(1)
          ')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED latest=$LATEST"
          python3 - "$PINNED" "$LATEST" <<'PYEOF'
          import re, sys
          def key(v):
              return tuple(int(x) for x in re.findall(r"\d+", v)[:3])
          pinned, latest = sys.argv[1], sys.argv[2]
          if key(latest) > key(pinned):
              print(f"::error::Flutter SDK pin is STALE: {pinned} → latest stable {latest}. Bump flutter-version in the mobile job, run flutter test --update-goldens, and push.")
              sys.exit(1)
          print(f"Flutter SDK pin is current ({pinned} == latest stable {latest})")
          PYEOF

      - name: Open (or update) stale-pin issue
        if: steps.sdk.outputs.latest != '' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Flutter SDK pin is stale' --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Flutter SDK pin is stale: ${{ steps.sdk.outputs.pinned }} → ${{ steps.sdk.outputs.latest }}" \
              --body "The mobile CI job pins Flutter ${{ steps.sdk.outputs.pinned }}, but the latest stable is ${{ steps.sdk.outputs.latest }}. Bump flutter-version in the mobile job. If orb rendering changed, run flutter test --update-goldens and commit. This issue closes automatically once the pin is current."
          else
            echo "Stale-pin issue already open — skipping creation."
          fi

      - name: Close stale-pin issue (pin is current again)
        if: steps.sdk.outputs.latest != '' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Flutter SDK pin is stale' --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Flutter SDK pin is current again — closing automatically."
          fi
